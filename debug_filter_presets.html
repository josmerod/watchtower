<!DOCTYPE html>
<html>
<head>
    <title>Filter Presets Debug</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h2>Filter Presets Debug</h2>

        <div class="mb-3">
            <label>Test Preset Name:</label>
            <input type="text" id="testPresetName" class="form-control" placeholder="Enter preset name">
        </div>

        <div class="mb-3">
            <label>Test Filters:</label>
            <input type="text" id="testFilters" class="form-control" placeholder='{"search": "test", "category": "AI"}'>
        </div>

        <div class="btn-group mb-3">
            <button onclick="testSavePreset()" class="btn btn-primary">Save Preset</button>
            <button onclick="testLoadPresets()" class="btn btn-secondary">Load Presets</button>
            <button onclick="testClearAll()" class="btn btn-danger">Clear All</button>
        </div>

        <div id="results" class="alert alert-info"></div>
    </div>

    <script src="src/web/dashboard/assets/js/localStorage.js"></script>
    <script>
        function testSavePreset() {
            const name = document.getElementById('testPresetName').value;
            const filtersStr = document.getElementById('testFilters').value;

            if (!name) {
                showResult('Please enter a preset name', 'danger');
                return;
            }

            let filters;
            try {
                filters = JSON.parse(filtersStr || '{}');
            } catch (e) {
                showResult('Invalid JSON format for filters', 'danger');
                return;
            }

            try {
                const result = window.saveFilterPreset('test_tab', name, filters);
                showResult(JSON.stringify(result, null, 2), result.success ? 'success' : 'danger');
            } catch (error) {
                showResult('Error: ' + error.message, 'danger');
            }
        }

        function testLoadPresets() {
            try {
                const options = window.getFilterPresetOptions('test_tab');
                showResult('Preset options: ' + JSON.stringify(options, null, 2), 'info');
            } catch (error) {
                showResult('Error loading presets: ' + error.message, 'danger');
            }
        }

        function testClearAll() {
            try {
                const result = window.filterPresetsManager.clearAllPresets();
                showResult('Cleared all presets: ' + result, 'success');
            } catch (error) {
                showResult('Error clearing presets: ' + error.message, 'danger');
            }
        }

        function showResult(message, type) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.className = `alert alert-${type}`;
            resultsDiv.textContent = message;
        }

        // Check if localStorage manager is loaded
        window.addEventListener('load', function() {
            if (window.filterPresetsManager) {
                showResult('LocalStorage manager loaded successfully', 'success');
            } else {
                showResult('LocalStorage manager not found', 'danger');
            }
        });
    </script>
</body>
</html>
