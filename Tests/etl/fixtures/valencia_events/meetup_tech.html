<!doctype html><html><body><script type="application/ld+json">[{"@context": "https://schema.org", "@type": "Event", "name": "Quality vs. velocity: can you have both?", "url": "https://www.meetup.com/valencia-codes/events/317443844/", "description": "Valencia Codes would like to welcome you all to our #30 edition of Level Up at the offices of Deutsche Telekom.\n\n**What is Level Up?** It's a monthly meet-up where we will be inviting speakers from inside and outside of our community to introduce you to interesting technical topics and share their experiences with you.\n\n**Quality vs. velocity: can you have both?** *by Marcel Kalveram, Product Engineer @ Artificial Labs*\n\nWhat if a high-stakes client might churn unless you cut the development time for a complex feature from two quarters to a month? We faced that challenge recently, turning a customer’s manual Excel workflow into a robust, battle-tested feature inside our platform.\n\nWe started with a vibed prototype, then worked with engineers and designers to turn it into a production-ready solution, edge cases included. As the codebase and pull requests grew, implementation details and reviews became major bottlenecks.\n\nWith our old development process, we would have driven the project straight into the ground, so we embraced agentic engineering to accelerate good old engineering best practices at scale: clearly defined module boundaries, proper documentation, and PRs optimised for human review.\n\nI’ll share some of the trade-offs we made along the way and some uncomfortable truths I had to confront. But I’ll also explain why good architecture and clear interfaces matter more than ever when code is cheap to produce, and why I believe this approach will become the new standard for companies that need to move fast.\n\n**Agenda**\n1800 - Snacks 🍕, Drinks 🍻 and networking\n1830 - Talk **Quality vs. velocity: can you have both?**\n1900 - Open discussion: How to manage quality and velocity in the development processes\n2000 - More networking!\n\n**Sponsors**\n\\- Our hosts for this event are Deutsche Telekom IT", "startDate": "2026-12-02T17:00:00.000Z", "endDate": "", "eventStatus": "https://schema.org/EventScheduled", "image": "/images/fallbacks/redesign/group-cover-1-square.webp", "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode", "location": {"@type": "Place", "name": "Deutsche Telekom Office", "address": {"@type": "PostalAddress", "addressLocality": "Valencia", "addressRegion": "", "addressCountry": "es", "streetAddress": "Av. del Marqués de Sotelo, 6, Valencia"}}, "organizer": {"@type": "Organization", "name": "Valencia Codes", "url": "https://www.meetup.com/valencia-codes/"}, "performer": "Valencia Codes"}, {"@context": "https://schema.org", "@type": "Event", "name": "Go-To-Market Teardown December x SYNC Social Club", "url": "https://www.meetup.com/ai-tinkerers-valencia/events/317577690/", "description": "⚠️ 👉 **[Confirm your attendance](https://valencia.aitinkerers.org/p/gtm-teardown-december-ai-tinkerers-valencia-x-sync-social-club)** **(RSVP is mandatory)**\n\n**You built it. Nobody came. Let's fix that.**\n\nEvery builder in this room has the same dirty secret: the product works, the landing page is live, but prompting Claude \"bring me clients\" doesn't work.\n\nNobody teaches this part. AI Twitter sells you hype, LinkedIn is full bots, so we do teardowns.\n\n*If you want to start using agents to help you bring clients after you launched something into the void, this is your night.*\n\n**How it works**\n\n* 🎯 **One case study.** A founder or operator who uses AI and automation to accelerate go-to-market and growth functions with tangible results. Real dashboards, it's pic or fake.\n* 🔧 **The teardowns.** 2–3 brave members volunteer their own product. Everything goes on screen: landing page, pricing, funnel, real traffic. The room, plus a couple of invited operators who've actually scaled things, tears it apart and rebuilds it live.\n* 🍺 **The debrief.** Beers, hot takes, and everyone quietly writing systems in their head.\n\n**Volunteer your product (yes, you)**\n\nThis only works if someone's in the hot seat. **Here's the deal:**\n\n* You have something live — a product, a landing page, a waitlist, anything with a URL\n* You're willing to show real numbers, even if you have 3 visitors, especially if it's 3 visitors\n* You want honest feedback, not applause\n\n**Not launched? Even better.** Pre-launch teardowns save you months of shipping into silence.\n\n**Who is this for?**\n\n* You can ship a product in a week but you can't make a sale in a year\n* You want to discover systems and automations to accelerate your growth\n* You'd rather get roasted by builders than ignored by the internet\n\nSponsored by [Base Founders](https://www.basefounders.org/), [SYNC](https://www.syncsocialclub.com/)\n\nOrganized by [Gerard Fernandez](https://gerardferlo.com/) & [Pierre Huchot](https://pierrot.tech/)", "startDate": "2026-12-03T17:00:00.000Z", "endDate": "", "eventStatus": "https://schema.org/EventScheduled", "image": "/images/fallbacks/redesign/group-cover-3-square.webp", "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode", "location": {"@type": "Place", "name": "GoHub Ventures", "address": {"@type": "PostalAddress", "addressLocality": "València", "addressRegion": "VC", "addressCountry": "es", "streetAddress": "C/ d'Alvaro de Bazan, 10, El Pla del Real, 46010 València, Valencia, Spain, València, VC"}}, "organizer": {"@type": "Organization", "name": "AI Tinkerers - Valencia", "url": "https://www.meetup.com/ai-tinkerers-valencia/"}, "performer": "AI Tinkerers - Valencia"}, {"@context": "https://schema.org", "@type": "Event", "name": "Cloud Native Valencia #6: One More Deploy", "url": "https://www.meetup.com/cloud-native-valencia/events/317411652/", "description": "**Cloud Native Valencia #6 presents: One More Deploy**\n\nUnfortunately, due to the heavy rains in October, we had to postpone our #6 meetup (Nit d'Octubre). The safety and well-being of our community will always come first 🙏\n\nNow, we hope everyone is doing well and has made it through this challenging period, and we're excited to give it another go this December!\n\nDecember (and the cold) is around the corner, and so is a fresh drop of cloud native ideas. Join the Cloud Native Valencia community for an evening of practical talks, real-world lessons, and conversations with people building and running modern platforms every day.\n\nThis meetup features three talks from local engineers, plus plenty of time for networking, snacks, and good conversation. Expect sessions on Kubernetes, platform engineering, observability, and the kinds of challenges that only show up in production. No fluff, just useful insights and honest experiences from the community.\n\nThis event is made possible thanks to our sponsor, [Veeam](https://veeam.com).\n\n**Location:** The Terminal Hub\nC. de la Travesía, Poblados Marítimos, 46024 València, Valencia\nThe meetup will take place in the AULA room.\n\n**How to get there?**\n**Bus:** Lines 19, 92 and 95\n**Parking**: Paid parking available at the terminal, with additional public options nearby\n\nJoin us on December 10th at 18:00 at The Terminal Hub and be part of the Cloud Native Valencia community.\n\nhttps://cloudnativevalencia.com\norganizers@cloudnativevalencia.com", "startDate": "2026-12-10T17:00:00.000Z", "endDate": "", "eventStatus": "https://schema.org/EventScheduled", "image": "/images/fallbacks/redesign/group-cover-4-square.webp", "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode", "location": {"@type": "Place", "name": "The Terminal Hub", "address": {"@type": "PostalAddress", "addressLocality": "Valencia", "addressRegion": "VC", "addressCountry": "es", "streetAddress": "C. de la Travesía, Poblados Marítimos, 46024 Valencia, Spain, Valencia, VC"}}, "organizer": {"@type": "Organization", "name": "Cloud Native Valencia", "url": "https://www.meetup.com/cloud-native-valencia/"}, "performer": "Cloud Native Valencia"}, {"@context": "https://schema.org", "@type": "Event", "name": "Martes de puertas abiertas", "url": "https://www.meetup.com/hackerspace-valencia/events/317481684/", "description": "Los martes cada 2 semanas, el Hackerspace Valencia celebra su jornada de puertas abiertas donde l@s soci@s se reúnen para trabajar en diferentes proyectos. Además, tod@s l@s no soci@s son bienvenid@s para conocer el espacio, la Asociación y en lo que estamos trabajando. El horario de apertura es de 18:30 hasta las 20:30\n\nEn caso de que el martes sea festivo, el local no abrirá.", "startDate": "2026-12-08T17:30:00.000Z", "endDate": "", "eventStatus": "https://schema.org/EventScheduled", "image": "/images/fallbacks/redesign/group-cover-4-square.webp", "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode", "location": {"@type": "Place", "name": "Hackerspace Valencia", "address": {"@type": "PostalAddress", "addressLocality": "Valencia", "addressRegion": "", "addressCountry": "es", "streetAddress": "Calle Francisco Martínez, 19, bajo, Valencia"}}, "organizer": {"@type": "Organization", "name": "Hackerspace Valencia", "url": "https://www.meetup.com/hackerspace-valencia/"}, "performer": "Hackerspace Valencia"}, {"@context": "https://schema.org", "@type": "Event", "name": "Generative AI - AI As A Scientist", "url": "https://www.meetup.com/generative-ai-belgium/events/317367666/", "description": "Hey Everyone! 👋\n\n**Location:**\n\n* On-site: Wintercircus, Miriam Makebaplein 2, 9000 Gent (next to De Krook)\n* Public Transport: 30 min. walk from Ghent Sint Pieters & Ghent Dampoort with public transport to \"Zuid\".\n* By bike: Parking on the street available.\n* By Car: Paid parking at Parking Zuid\n* Online: Zoom link in the event page.\n\n**Practicalities for the evening on Wednesday, December 2:**\n\n* 18:30: Doors Open, drinks\n* 19:00: Speaker Talks\n* 20:30: Networking & Drinks\n\n**Welcome to edition 17 of the Generative AI Belgium Meetup! 🚀**\n\nWhat should be the role of AI in scientific discovery? 🧬🧮\n\nFrom AlphaFold 2's breakthrough in protein structure prediction in 2020 to AI systems tackling mathematical proofs today, AI keeps contributing to science in new ways.\n\nTogether with Bits in Bio, we'll explore this across computer science, biology and the science of science: from software-verifiable results to the slower feedback loops of the wet lab, and from generating hypotheses to automated research workflows.\n\nBut producing an answer, understanding it and proving it useful are different achievements.\n\nA mathematical proof can sometimes be checked by software. A biological hypothesis still has to survive the lab. As generating ideas becomes easier, deciding which ones deserve our time and experimental budget becomes more important.\n\n**How do we collaborate with AI as a scientist?**\n\n* 🔬 Can it help us ask better questions?\n* 🔁 How do we connect literature, hypotheses, experiments and feedback?\n* 🧠 How do we gain understanding alongside faster results?\n* 🤝 Can it challenge our assumptions instead of simply agreeing?\n\nJoin us on December 2 at the Wintercircus, Miriam Makebaplein 2 in Ghent, where Generative AI Belgium × Bits in Bio brings the AI and biology communities together for AI as a Scientist.\n\nSee you there!\n\nLine-up:\n\n* [Nick Vangheluwe](https://www.linkedin.com/in/nvgheluw/)\n* [Andres Algaba](https://www.linkedin.com/in/andresalgaba/)\n* [Raman Talwar](https://www.linkedin.com/in/raman-talwar/)\n* [Hendrik Vercammen](https://sightera-biosciences.com/about)\n\nBig thanks to Wintercircus for letting us host our next event at this iconic location and big thanks to our sponsors: In The Pocket, BruCON, Red Hat, Collibra, Plainsight & Volta Ventures for supporting the community.", "startDate": "2026-12-02T17:30:00.000Z", "endDate": "", "eventStatus": "https://schema.org/EventScheduled", "image": "/images/fallbacks/redesign/group-cover-5-square.webp", "eventAttendanceMode": "https://schema.org/MixedEventAttendanceMode", "location": [{"@type": "VirtualLocation", "url": "https://www.meetup.com/generative-ai-belgium/events/317367666/"}, {"@type": "Place", "name": "Gent Wintercircus", "address": {"@type": "PostalAddress", "addressLocality": "Gent", "addressRegion": "", "addressCountry": "be", "streetAddress": "Miriam Makebaplein 2, Gent"}}], "organizer": {"@type": "Organization", "name": "Generative AI Belgium", "url": "https://www.meetup.com/generative-ai-belgium/"}, "performer": "Generative AI Belgium"}]</script></body></html>
