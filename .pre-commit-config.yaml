repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files
        args: ['--maxkb=1000']
    -   id: check-toml
    -   id: check-merge-conflict
    -   id: check-json
    -   id: check-xml
        exclude: ^\.bmad-ephemeral/
    -   id: check-case-conflict
    -   id: check-docstring-first
    -   id: check-executables-have-shebangs
    -   id: check-shebang-scripts-are-executable
    -   id: debug-statements
    -   id: name-tests-test
        args: ['--pytest-test-first']
    -   id: requirements-txt-fixer
    exclude: ^\.bmad-ephemeral/

-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.5
    hooks:
    -   id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi, jupyter]
    -   id: ruff-format
        types_or: [python, pyi, jupyter]

# NOTE: black removed — ruff-format is the single source of truth for formatting
# (per AGENTS.md). Running both caused conflicts where each reformatted the
# other's output. ruff-format uses the same defaults (double quotes, 4-space).

-   repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
    -   id: flake8
        exclude: ^Tests/
        additional_dependencies: [Flake8-pyproject]

-   repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
    -   id: codespell
        exclude: ^(src/miners/|.bmad/|logs.txt|.*\.log|docs/|data/)
        args: [-L, "assertIn,hace,anual,indien,als,alle,wil,lokale,cursos,clases,traker,componentes,intelectual,optimice,potencial,braket,ehr,ser,funcional,re-use,searchin,sesion,carrer,calle,momento,skool,extensiones,valide,avance,controles,halp,desig,thi,architec,whethe,ond,inthe,learnin,onw,proffes,brin,bein,profies,fron,sence,vrsion,vesion,meu,cliente,Cliente,clientes,Clientes,varios,Comandos,comandos,medias,Oficial,oficial,Autor,autor,htts,THN,relevante,Relevante,crate,crates,fases,Fases"]
        additional_dependencies:
          - tomli

-   repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
    -   id: shellcheck

-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.0
    hooks:
    -   id: mypy
        args: [--ignore-missing-imports, --show-error-codes]
        exclude: ^(src/|Tests/|utils/|[^/]+\.py$)
        additional_dependencies:
          - types-requests
          - types-python-dateutil
          - types-pytz
          - types-tqdm
          - types-beautifulsoup4
          - types-pyyaml
          - types-setuptools
          - types-toml
          - pydantic
          - fastapi
          - streamlit
          - polars
          - pandas-stubs



-   repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
    -   id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package.lock.json

-   repo: local
    hooks:
    -   id: pytest-check
        name: pytest-check
        entry: pytest
        language: system
        pass_filenames: false
        always_run: true
        args: [--tb=short, -q]
        stages: [push]
