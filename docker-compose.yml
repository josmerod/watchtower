version: '3.8'

services:
  watchtower:
    build: .
    container_name: watchtower-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - WATCHTOWER_MODE=production
      - WATCHTOWER_ETL_INTERVAL=7200  # Run ETL every 2 hours
      - WATCHTOWER_DASHBOARD_PORT=7777
      - WATCHTOWER_LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./secrets:/app/secrets:ro
    ports:
      - "7777:7777"    # dashboard / external tunnel
      - "45714:45714"  # API / Hermes cron jobs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:45714/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - watchtower-network

networks:
  watchtower-network:
    driver: bridge
