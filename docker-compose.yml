version: '3.8'

services:
  watchtower:
    build: .
    container_name: watchtower-app
    restart: unless-stopped
    environment:
      - WATCHTOWER_MODE=production
      - WATCHTOWER_ETL_INTERVAL=7200  # Run ETL every 2 hours
      - WATCHTOWER_DASHBOARD_PORT=7777
      - WATCHTOWER_LOG_LEVEL=INFO
    volumes:
      - /mnt/user/appdata/watchtower/data:/app/data
      - /mnt/user/appdata/watchtower/logs:/app/logs
      - /mnt/user/appdata/watchtower/secrets:/app/secrets:ro
    ports:
      - "7777:7777"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7777/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - watchtower-network

  # Optional: Redis for caching and job queue (if needed in future)
  # redis:
  #   image: redis:7-alpine
  #   container_name: watchtower-redis
  #   restart: unless-stopped
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - watchtower-network

networks:
  watchtower-network:
    driver: bridge

# Uncomment if using Redis
# volumes:
#   redis_data:
