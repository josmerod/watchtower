[project]
name = "watchtower"
version = "0.1.0"
description = "A comprehensive monitoring and ETL framework for scraping, aggregating, and visualizing data from diverse online sources"
authors = [
    { name = "Watchtower Team", email = "team@watchtower.dev" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["data-collection", "monitoring", "etl", "web-scraping", "data-intelligence"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

# Core dependencies
dependencies = [
    # Core data processing and analysis
    "pandas>=2.2.3",
    "numpy>=2.2.5",
    "scikit-learn>=1.6.1",
    "python-dateutil>=2.9.0.post0",
    # Data validation and configuration
    "pydantic>=2.11.5",
    "pydantic-settings>=2.14.2",
    # Web scraping and API interaction
    "requests>=2.33.0",
    "beautifulsoup4>=4.13.3",
    "playwright>=1.51.0",
    "feedparser>=6.0.11",
    "aiohttp>=3.14.1",
    "yt-dlp>=2026.6.9",
    "cloudscraper>=1.2.60",
    # Web framework and UI
    "plotly>=5.0.0",
    # Natural Language Processing
    "nltk>=3.10.0",
    # Configuration and utilities
    "python-dotenv>=1.2.2",
    # System monitoring
    "psutil>=6.0.0",
    "watchdog>=6.0.0",
    # Additional dependencies for enhanced functionality
    "tenacity>=9.1.2",
    "certifi>=2025.1.31",
    "pillow>=12.3.0",
    "urllib3>=2.7.0",
    # Additional UI components
    "dash>=2.0.0",
    "dash-bootstrap-components>=1.0.0",
    "pytesseract>=0.3.10",
    "opencv-python>=4.8.0",
    "openai>=2.11.0",
    # API dependencies
    "fastapi>=0.136.3",
    "uvicorn>=0.27.0",
]

[project.optional-dependencies]
# Development dependencies
dev = [
    "ruff>=0.2.0",
    "pytest>=7.0",
    "pytest-cov>=4.1.0",
    "pre-commit>=3.5.0",
    "mypy>=1.7.0",
    "black>=24.1.0",
]

# All optional dependencies combined
all = [
    "ruff>=0.2.0",
    "pytest>=7.0",
    "pytest-cov>=4.1.0",
    "pre-commit>=3.5.0",
    "mypy>=1.7.0",
    "black>=24.1.0",
]

[tool.black]
line-length = 210


[project.urls]
Homepage = "https://github.com/yourusername/watchtower"
Repository = "https://github.com/yourusername/watchtower"
Documentation = "https://github.com/yourusername/watchtower/blob/main/README.md"
"Bug Reports" = "https://github.com/yourusername/watchtower/issues"

[project.scripts]
watchtower-dashboard = "run_watchtower_dashboard:main"

watchtower-etl = "src.etl.base:run_etl_cli"
watchtower-watcher = "src.watchers.base_watcher:run_watcher_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# UV-specific configurations
[tool.uv]
dev-dependencies = [
    "ruff>=0.2.0",
    "pytest>=7.0",
    "pytest-cov>=4.1.0",
    "pre-commit>=3.5.0",
    "mypy>=1.7.0",
    "black>=24.1.0",
    "flake8>=7.3.0",
    "codespell>=2.4.1",
    "shellcheck-py>=0.11.0.1",
    "detect-secrets>=1.5.0",
    # Type stubs for mypy (reduce import-untyped errors)
    "pandas-stubs>=2.0",
    "types-paramiko>=3.0",
    "types-requests>=2.31",
    "types-python-dateutil>=2.9",
]

# Ruff configuration.
# Rule selection and exclude live under [tool.ruff.lint] (the modern layout).
# The previous [tool.ruff]-level select/exclude was deprecated AND erroneously
# excluded "src" and "*.py", which silently disabled linting of all source.
[tool.ruff]
line-length = 210
target-version = "py310"
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "Tests",   # tests have their own conventions (F841 in assertions, SIM117, etc.)
    # Vendored / generated code we don't lint
    "src/miners/udemy-universal",
    "src/miners/asf-winonly",
]

[tool.ruff.lint]
# Pragmatic rule set: catches real bugs without forcing docstrings (D) across
# the existing codebase. Add "D" back once docstring coverage is acceptable.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (undefined names, unused imports, etc.)
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "RUF", # Ruff-specific rules
    "SIM", # simplify
]
# Ignore refactor-heavy style rules that would require touching hundreds of
# lines without fixing bugs. Re-enable one at a time when the codebase is ready.
ignore = [
    "SIM102",  # nested if -> collapse (readability preference)
    "SIM105",  # contextlib.suppress instead of try/except/pass
    "SIM108",  # ternary instead of if/else assignment
    "RUF001",  # ambiguous unicode char (Spanish accents trip this)
    "RUF005",  # iterable unpacking instead of concatenation
    "RUF012",  # Mutable class annotations should be ClassVar
    "RUF013",  # PEP 484 implicit Optional
    "E402",    # module-level import not at top (many ETLs set env first)
    "E722",    # bare except (existing pattern, flagged for cleanup)
    "F401",    # unused imports (many __init__.py re-exports, dynamic imports)
    "E741",    # ambiguous variable name (l, I, O) — cosmetic
    "E501",    # line too long (line-length=210 already generous)
    "UP031",   # use format spec instead of % (existing pattern)
    "F403",    # from X import * (config/__init__.py, utils/__init__.py re-exports)
    "SIM116",  # use dict instead of if/elif chains (style preference)
    "UP038",   # isinstance X | Y (rule removed in newer ruff, hook uses older)
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.pydocstyle]
convention = "google"  # Honored when "D" is re-enabled

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
no_implicit_optional = false
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
exclude = ["src/miners/udemy-universal"]

[tool.pytest.ini_options]
testpaths = ["Tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-config --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "e2e: End-to-end tests",
    "slow: Slow running tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
    "src/miners/udemy-universal/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
