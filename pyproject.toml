[project]
name = "watchtower"
version = "0.1.0"
description = "A versatile data collection, processing, and application platform."
authors = [
    { name = "Your Name", email = "your@email.com" }, # Optional: Add your details
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "playwright>=1.51.0",
    "requests>=2.32.3",
    "paperswithcode-client>=0.3.1", # Known Pydantic v1 conflict; kept for now.
    "beautifulsoup4>=4.13.3",
    "feedparser>=6.0.11",
    "nltk>=3.9.1",
    "numpy>=2.2.5",
    "pandas>=2.2.3",
    "scikit-learn>=1.6.1",
    "scipy>=1.15.2", # Potentially transitive, review if truly unused by core logic.
    "joblib>=1.5.0", # Potentially transitive, review if truly unused by core logic.
    "tqdm>=4.67.1",
    "python-dateutil>=2.9.0.post0",
    "pytz>=2025.2", # Potentially transitive, review if truly unused by core logic.
    "streamlit>=1.45.0", # Updated version
    "polars>=0.20.0",
    "pydantic>=2.11.5", # Moved from web optional, version updated
    "pydantic-settings>=2.9.1",
    "typing-extensions>=4.13.2", # Often a Pydantic peer dependency
    "aiohttp>=3.11.18",
    "yt-dlp>=2024.3.10",
    "cloudscraper>=1.2.60",
    "plotly>=5.0.0",
    "toml>=0.10.2",
    "google-api-python-client>=2.0.0",
    "isodate>=0.6.0",
    "psutil>=6.0.0",
    "tenacity>=9.1.2",
    "blinker>=1.9.0",
    "cachetools>=5.5.2",
    "GitPython>=3.1.44",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.2.0",
    "pytest>=7.0",
    "pytest-cov>=4.1.0",
    "pre-commit>=3.5.0",
    "mypy>=1.7.0",
    "black>=24.1.0",
]

ml = [
    "langgraph>=0.0.20",
    "faiss-cpu>=1.7.4",
    "chromadb>=0.4.22",
]

web = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    # pydantic was moved to core dependencies
    "httpx>=0.27.0",
]

[project.urls]
"Homepage" = "https://github.com/yourusername/watchtower"
"Bug Tracker" = "https://github.com/yourusername/watchtower/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
# uv specific configurations can go here if needed in the future

[tool.ruff]
line-length = 88
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings 
    "I",   # isort
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "RUF", # Ruff-specific rules
    "N",   # pep8-naming
    "D",   # pydocstyle
    "PT",  # pytest style
    "SIM", # simplify
]
ignore = [
    "E501",    # Line too long (handled by formatter)
    "D100",    # Missing docstring in public module
    "D104",    # Missing docstring in public package
]

[tool.ruff.pydocstyle]
convention = "google"  # Use Google-style docstrings

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.ruff.isort]
known-first-party = ["watchtower"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["nltk.*", "scipy.*", "sklearn.*", "streamlit.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=src --cov-report=term-missing"
testpaths = [
    "tests",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*" 