[tool.poetry]
name = "watchtower"
version = "0.1.0"
description = "A versatile data collection, processing, and application platform."
authors = ["Your Name <your@email.com>"] # Optional: Add your details
readme = "README.md"
license = "MIT" # Assuming MIT license identifier
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
packages = [  # Include only actual Python packages from src
    { include = "config", from = "src" },
    { include = "models", from = "src" },
    { include = "exceptions", from = "src" },
    { include = "watchers", from = "src" },
    { include = "utils", from = "src" },
    { include = "miners", from = "src" },
    { include = "etl", from = "src" },
    { include = "web", from = "src" },
    { include = "analytics", from = "src" },
]

# Project URLs can be defined here if desired, matching [project.urls]
homepage = "https://github.com/yourusername/watchtower"
repository = "https://github.com/yourusername/watchtower" # Common for Poetry
documentation = "https://github.com/yourusername/watchtower/blob/main/README.md" # Example
# "Bug Tracker" can be listed under repository or documentation, or kept as a separate URL if Poetry supports it directly.
# For now, adding common ones.

[tool.poetry.dependencies]
python = ">=3.10"
playwright = ">=1.51.0"
requests = ">=2.32.3"
# paperswithcode-client = ">=0.3.1" # Removed due to Pydantic v1 conflict
beautifulsoup4 = ">=4.13.3"
feedparser = ">=6.0.11"
nltk = ">=3.9.1"
numpy = ">=2.2.5"
pandas = ">=2.2.3"
scikit-learn = ">=1.6.1"
scipy = ">=1.15.2" # Potentially transitive, review if truly unused by core logic.
joblib = ">=1.5.0" # Potentially transitive, review if truly unused by core logic.
tqdm = ">=4.67.1"
python-dateutil = ">=2.9.0.post0"
pytz = ">=2025.2" # Potentially transitive, review if truly unused by core logic.
streamlit = ">=1.45.0" # Updated version
polars = ">=0.20.0"
pydantic = ">=2.11.5" # Moved from web optional, version updated
pydantic-settings = ">=2.9.1"
typing-extensions = ">=4.13.2" # Often a Pydantic peer dependency
aiohttp = ">=3.11.18"
yt-dlp = ">=2024.3.10"
cloudscraper = ">=1.2.60"
plotly = ">=5.0.0"
toml = ">=0.10.2" # Note: toml is also used by pyproject.toml itself. Poetry handles this.
google-api-python-client = ">=2.0.0"
isodate = ">=0.6.0"
psutil = ">=6.0.0"
tenacity = ">=9.1.2"
blinker = ">=1.9.0"
cachetools = ">=5.5.2"
GitPython = ">=3.1.44"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.2.0"
pytest = ">=7.0"
pytest-cov = ">=4.1.0"
pre-commit = ">=3.5.0"
mypy = ">=1.7.0"
black = ">=2.4.0"

[tool.poetry.group.ml.dependencies]
langgraph = ">=0.0.20"
faiss-cpu = ">=1.7.4"
chromadb = ">=0.4.22"

[tool.poetry.group.web.dependencies]
fastapi = ">=0.110.0"
uvicorn = ">=0.27.0"
# pydantic was moved to core dependencies
httpx = ">=0.27.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

# Preserving existing tool configurations
[tool.uv]
# uv specific configurations can go here if needed in the future

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings 
    "I",   # isort
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "RUF", # Ruff-specific rules
    "N",   # pep8-naming
    "D",   # pydocstyle
    "PT",  # pytest style
    "SIM", # simplify
]
ignore = [
    "E501",    # Line too long (handled by formatter)
    "D100",    # Missing docstring in public module
    "D104",    # Missing docstring in public package
]

[tool.ruff.lint.pydocstyle]
convention = "google"  # Use Google-style docstrings

[tool.ruff.lint.isort]
known-first-party = ["watchtower"] # This might need adjustment if package structure changes with Poetry
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["nltk.*", "scipy.*", "sklearn.*", "streamlit.*"] # May need to add others if they cause issues
ignore_missing_imports = true

[tool.pytest.ini_options] # This section is for pytest, not directly used by Poetry but good to keep
minversion = "7.0"
addopts = "-ra -q --cov=src --cov-report=term-missing" # --cov=src might need to be --cov=watchtower
testpaths = [
    "tests",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*" 