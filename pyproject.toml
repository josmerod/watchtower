[project]
name = "watchtower"
version = "0.1.0"
description = "A comprehensive monitoring and ETL framework for scraping, aggregating, and visualizing data from diverse online sources"
authors = [
    { name = "Watchtower Team", email = "team@watchtower.dev" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["data-collection", "monitoring", "etl", "web-scraping", "streamlit", "data-intelligence"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

# Core dependencies
dependencies = [
    # Core data processing and analysis
    "pandas>=2.2.3",
    "numpy>=2.2.5",
    "polars>=0.20.0",
    "scikit-learn>=1.6.1",
    "python-dateutil>=2.9.0.post0",
    "pytz>=2025.2",
    # Data validation and configuration
    "pydantic>=2.11.5",
    "pydantic-settings>=2.9.1",
    "typing-extensions>=4.13.2",
    # Web scraping and API interaction
    "requests>=2.32.3",
    "beautifulsoup4>=4.13.3",
    "html5lib>=1.1",
    "playwright>=1.51.0",
    "feedparser>=6.0.11",
    "aiohttp>=3.11.18",
    "yt-dlp>=2024.3.10",
    "cloudscraper>=1.2.60",
    # Web framework and UI
    "streamlit>=1.45.0",
    "plotly>=5.0.0",
    "tabulate>=0.8.0",
    "altair>=5.5.0",
    # Natural Language Processing
    "nltk>=3.9.1",
    "tqdm>=4.67.1",
    # Configuration and utilities
    "python-dotenv>=1.0.0",
    # YouTube API utilities (optional - used in specific ETLs)
    "google-api-python-client>=2.0.0",
    "isodate>=0.6.0",
    # System monitoring
    "psutil>=6.0.0",
    "watchdog>=6.0.0",
    # Additional dependencies for enhanced functionality
    "tenacity>=9.1.2",
    "blinker>=1.9.0",
    "cachetools>=5.5.2",
    "certifi>=2025.1.31",
    "charset-normalizer>=3.4.1",
    "idna>=3.10",
    "jsonschema>=4.23.0",
    "packaging>=24.2",
    "pillow>=11.2.1",
    "pyarrow>=20.0.0",
    "referencing>=0.36.2",
    "rpds-py>=0.25.1",
    "urllib3>=2.4.0",
    "markupsafe>=3.0.2",
    "jinja2>=3.1.6",
    "click>=8.0,<8.2",
    "colorama>=0.4.6",
    # Git integration
    "GitPython>=3.1.44",
    "gitdb>=4.0.12",
    "smmap>=5.0.2",
    # Additional UI components
    "dash>=2.0.0",
    "dash-bootstrap-components>=1.0.0",
    "moviepy>=2.0.0",
    "pytesseract>=0.3.10",
    "opencv-python>=4.8.0",
    "openai>=2.11.0",
    "paramiko>=4.0.0",
    # API dependencies
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# Development dependencies
dev = [
    "ruff>=0.2.0",
    "pytest>=7.0",
    "pytest-cov>=4.1.0",
    "pre-commit>=3.5.0",
    "mypy>=1.7.0",
    "black>=24.1.0",
]

# Machine Learning dependencies (currently unused)
ml = [
    "langgraph>=0.0.20",
    "faiss-cpu>=1.7.4",
    "chromadb>=0.4.22",
]

# Web API dependencies (moved to core)
# web = [
#     "fastapi>=0.110.0",
#     "uvicorn>=0.27.0",
#     "httpx>=0.27.0",
# ]

# All optional dependencies combined
all = [
    "ruff>=0.2.0",
    "pytest>=7.0",
    "pytest-cov>=4.1.0",
    "pre-commit>=3.5.0",
    "mypy>=1.7.0",
    "black>=24.1.0",
    "langgraph>=0.0.20",
    "faiss-cpu>=1.7.4",
    "chromadb>=0.4.22",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "httpx>=0.27.0",
]

[tool.black]
line-length = 210


[project.urls]
Homepage = "https://github.com/yourusername/watchtower"
Repository = "https://github.com/yourusername/watchtower"
Documentation = "https://github.com/yourusername/watchtower/blob/main/README.md"
"Bug Reports" = "https://github.com/yourusername/watchtower/issues"

[project.scripts]
watchtower-dashboard = "run_watchtower_dashboard:main"

watchtower-etl = "src.etl.base:run_etl_cli"
watchtower-watcher = "src.watchers.base_watcher:run_watcher_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# UV-specific configurations
[tool.uv]
dev-dependencies = [
    "ruff>=0.2.0",
    "pytest>=7.0",
    "pytest-cov>=4.1.0",
    "pre-commit>=3.5.0",
    "mypy>=1.7.0",
    "black>=24.1.0",
    "flake8>=7.3.0",
    "codespell>=2.4.1",
    "shellcheck-py>=0.11.0.1",
    "detect-secrets>=1.5.0",
]

# Preserving existing tool configurations
[tool.ruff]
line-length = 210
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "RUF", # Ruff-specific rules
    "N",   # pep8-naming
    "D",   # pydocstyle
    "PT",  # pytest style
    "SIM", # simplify
]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "Tests",
    "src",
    "*.py",
]

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E4", "E7", "E9", "F"]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.pydocstyle]
convention = "google"  # Use Google-style docstrings

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
no_implicit_optional = false
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
exclude = ["src/miners/udemy-universal"]

[tool.pytest.ini_options]
testpaths = ["Tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-config --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "e2e: End-to-end tests",
    "slow: Slow running tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
    "src/miners/udemy-universal/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
