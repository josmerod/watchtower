name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Pinned on purpose: ubuntu-latest is 26.04 and the Playwright locked at
    # the time (1.60, 2026-10) ships no chromium for it, so `playwright
    # install` fails there. Move the pin with the lock, not before it.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Install Playwright chromium
        run: uv run playwright install chromium --with-deps

      - name: Lint (ruff check)
        run: uv run ruff check --output-format=github .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Syntax check
        # Every shipped file, including the ones no test imports.
        run: uv run python -m compileall -q src deployment run_all_etl_orchestrator.py run_watchtower_dashboard.py

      - name: Run tests
        run: uv run pytest Tests/ -v
        # T-049: blocking since the suite went green. Browser e2e (Tests/e2e)
        # run for real: chromium is installed above; the conftest still guards
        # environments where the binary is missing (skip, not fail).

      - name: Deploy script against real paramiko
        # The deploy tests fake the SSH layer; this one pins the fake to the
        # library. It needs `python -m pytest`: a bare `pytest` entry point does
        # not see uv's ephemeral --with environment and would skip the test.
        run: uv run --with paramiko python -m pytest Tests/unit/test_deploy.py -k paramiko -v
