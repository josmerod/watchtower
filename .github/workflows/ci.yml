name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Install Playwright chromium
        run: uv run playwright install chromium --with-deps

      - name: Lint (ruff check)
        run: uv run ruff check --output-format=github .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Syntax check
        run: python -m py_compile src/api/main.py src/etl/base.py

      - name: Run tests
        run: uv run pytest Tests/ -v
        # T-049: blocking since the suite went green. Browser e2e (Tests/e2e)
        # run for real: chromium is installed above; the conftest still guards
        # environments where the binary is missing (skip, not fail).

      - name: Validate Dockerfile
        run: docker build -f deployment/Dockerfile --check . 2>/dev/null || docker build -f deployment/Dockerfile --quiet . 2>&1 | head -5
